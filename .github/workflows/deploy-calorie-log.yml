name: Deploy Calorie Log

on:
  push:
    branches: [master]
    paths:
      - 'calorie_log/**'
      - 'common/notion.py'
      - '.github/workflows/deploy-calorie-log.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-calorie-log
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test calorie logger
        run: |
          python -m pip install --disable-pip-version-check -r calorie_log/requirements.txt pytest
          python -m pytest calorie_log/tests eat_later/tests -q

      - name: Check deployment secrets
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
        run: |
          missing=0
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_KEY ORACLE_VM_KNOWN_HOSTS DISCORD_BOT_TOKEN NOTION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$RUNNER_TEMP/oracle_vm_key"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$RUNNER_TEMP/oracle_vm_known_hosts"

      - name: Deploy to Oracle VM
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
        run: |
          remote="$ORACLE_VM_USER@$ORACLE_VM_HOST"
          ssh_opts=(-i "$RUNNER_TEMP/oracle_vm_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/oracle_vm_known_hosts")

          ssh "${ssh_opts[@]}" "$remote" 'mkdir -p ~/tools/calorie_log ~/tools/common'
          tar -cf - calorie_log/*.py calorie_log/run.sh calorie_log/deploy_vm.sh calorie_log/requirements.txt common/__init__.py common/notion.py \
            | ssh "${ssh_opts[@]}" "$remote" 'cd ~/tools && tar -xf -'

          python - <<'PY'
          import os
          import shlex
          from pathlib import Path
          destination = Path(os.environ['RUNNER_TEMP']) / 'calorie-log.env'
          lines = [
              f'export {name}={shlex.quote(os.environ[name])}'
              for name in ('DISCORD_BOT_TOKEN', 'NOTION_SECRET')
          ]
          destination.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          destination.chmod(0o600)
          PY
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/calorie-log.env" "$remote:tools/calorie_log/.env.new"
          ssh "${ssh_opts[@]}" "$remote" 'chmod 600 ~/tools/calorie_log/.env.new && sh ~/tools/calorie_log/deploy_vm.sh'

          ssh "${ssh_opts[@]}" "$remote" 'systemctl is-active --quiet calorie-log.timer'
