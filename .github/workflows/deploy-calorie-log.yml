name: Deploy Calorie Log

on:
  push:
    branches: [master]
    paths:
      - 'calorie_log/**'
      - 'common/notion.py'
      - '.github/workflows/deploy-calorie-log.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-calorie-log
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test calorie logger
        run: |
          python -m pip install --disable-pip-version-check -r calorie_log/requirements.txt -r eat_later/requirements.txt
          python -m pytest calorie_log/tests eat_later/tests -q

      - name: Check deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
        run: |
          missing=0
          for name in VPS_HOST VPS_SSH_KEY DISCORD_BOT_TOKEN NOTION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/vps_known_hosts"
          else
            ssh-keyscan -H -T 10 "$VPS_HOST" > "$RUNNER_TEMP/vps_known_hosts"
          fi
          test -s "$RUNNER_TEMP/vps_known_hosts"

      - name: Deploy to Hetzner VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
        run: |
          remote="root@$VPS_HOST"
          ssh_opts=(-i "$RUNNER_TEMP/vps_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/vps_known_hosts")

          ssh "${ssh_opts[@]}" "$remote" 'mkdir -p /opt/calorie-log/calorie_log /opt/calorie-log/common'
          tar -cf - calorie_log/*.py calorie_log/food_calorie_reference.md calorie_log/run.sh calorie_log/deploy_vps.sh calorie_log/requirements.txt common/__init__.py common/notion.py \
            | ssh "${ssh_opts[@]}" "$remote" 'cd /opt/calorie-log && tar -xf -'

          python - <<'PY'
          import os
          import shlex
          from pathlib import Path
          destination = Path(os.environ['RUNNER_TEMP']) / 'calorie-log.env'
          lines = [
              f'export {name}={shlex.quote(os.environ[name])}'
              for name in ('DISCORD_BOT_TOKEN', 'NOTION_SECRET')
          ]
          destination.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          destination.chmod(0o600)
          PY
          ssh "${ssh_opts[@]}" "$remote" 'umask 077; cat > /opt/calorie-log/calorie_log/.env.new' < "$RUNNER_TEMP/calorie-log.env"
          ssh "${ssh_opts[@]}" "$remote" 'sh /opt/calorie-log/calorie_log/deploy_vps.sh'

          ssh "${ssh_opts[@]}" "$remote" 'systemctl is-active --quiet calorie-log.timer'
