name: Deploy Urgent Bell

on:
  push:
    branches: [master]
    paths:
      - 'urgent_bell/**'
      - '.github/workflows/deploy-urgent-bell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-urgent-bell
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urgent_bell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: urgent_bell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test urgent bell worker
        run: npm test

      - name: Check deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URGENT_BELL_LINE_CHANNEL_SECRET: ${{ secrets.URGENT_BELL_LINE_CHANNEL_SECRET }}
          URGENT_BELL_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.URGENT_BELL_LINE_CHANNEL_ACCESS_TOKEN }}
          URGENT_BELL_BARK_KEY: ${{ secrets.URGENT_BELL_BARK_KEY }}
          URGENT_BELL_CALLBACK_SECRET: ${{ secrets.URGENT_BELL_CALLBACK_SECRET }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      URGENT_BELL_LINE_CHANNEL_SECRET URGENT_BELL_LINE_CHANNEL_ACCESS_TOKEN \
                      URGENT_BELL_BARK_KEY URGENT_BELL_CALLBACK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Runs after deploy because `wrangler secret bulk` needs the Worker to already exist.
      # URGENT_BELL_WIFE_USER_ID is optional: left unset, the Worker stays in setup mode
      # (or keeps whatever value was set earlier with `wrangler secret put`).
      - name: Upload worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.URGENT_BELL_LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.URGENT_BELL_LINE_CHANNEL_ACCESS_TOKEN }}
          BARK_KEY: ${{ secrets.URGENT_BELL_BARK_KEY }}
          CALLBACK_SECRET: ${{ secrets.URGENT_BELL_CALLBACK_SECRET }}
          WIFE_USER_ID: ${{ secrets.URGENT_BELL_WIFE_USER_ID }}
        run: |
          secrets_file="$RUNNER_TEMP/urgent-bell-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          python - "$secrets_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          names = ('LINE_CHANNEL_SECRET', 'LINE_CHANNEL_ACCESS_TOKEN', 'BARK_KEY',
                   'CALLBACK_SECRET', 'WIFE_USER_ID')
          destination = Path(sys.argv[1])
          destination.touch(mode=0o600)
          destination.write_text(
              json.dumps({name: os.environ[name] for name in names if os.environ.get(name)}),
              encoding='utf-8',
          )
          PY
          npx wrangler secret bulk "$secrets_file"
